name: Weekly Chicago Crime Data Refresh & Retrain

on:
  schedule:
    - cron: "0 3 * * 0"  # Runs every Sunday at 3:00 AM UTC
  workflow_dispatch:      # Also lets you trigger a refresh manually from GitHub's UI

permissions:
  contents: write

jobs:
  update-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pandas numpy requests pyarrow scikit-learn joblib

      - name: Fetch latest crime records & retrain clustering model
        run: |
          python src/ingest.py
          python src/train.py

      - name: Commit updated data and model artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ models/
          git diff --staged --quiet || git commit -m "chore: refresh Chicago crime data and retrain hotspot model"
          git push